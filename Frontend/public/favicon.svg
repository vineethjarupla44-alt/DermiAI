<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#grad)" />
  <!-- Scanner Grid/Pulse Overlay -->
  <circle cx="50" cy="50" r="34" stroke="white" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="4 4" />
  <circle cx="50" cy="50" r="24" stroke="white" stroke-opacity="0.3" stroke-width="2" />
  <!-- Medical Cross / Focus Reticle -->
  <path d="M50 26V74M26 50H74" stroke="white" stroke-width="6" stroke-linecap="round" />
  <!-- Central AI Pulse Point -->
  <circle cx="50" cy="50" r="7" fill="url(#accent)" />
  <circle cx="50" cy="50" r="4" fill="white" />
</svg>
